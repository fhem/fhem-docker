name: Helm Chart

# Lints and packages the chart in kubernetes/chart. On a (non-pre) release the
# package is pushed as OCI artifact to ghcr.io and attached to the release.
# The chart version is taken from Chart.yaml as is; an already published
# version is never overwritten.
on:
  pull_request:
    paths:
      - "kubernetes/chart/**"
      - ".github/workflows/helm-chart.yml"

  release:
    types:
      - released

  workflow_dispatch:
    inputs:
      publish:
        description: "Push the chart to ghcr.io"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'release' && github.run_id || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CHART_DIR: kubernetes/chart
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
  # renovate: datasource=github-releases depName=helm packageName=helm/helm
  HELM_VERSION: v4.3.1

jobs:
  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the package to the release
      packages: write   # helm push to ghcr.io
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Read chart metadata
        id: meta
        run: |
          echo "name=$(yq '.name' "$CHART_DIR/Chart.yaml")" >> "$GITHUB_OUTPUT"
          echo "version=$(yq '.version' "$CHART_DIR/Chart.yaml")" >> "$GITHUB_OUTPUT"

      - name: Lint chart
        run: helm lint --strict "$CHART_DIR"

      - name: Render templates
        run: helm template ci "$CHART_DIR" > /dev/null

      - name: Package chart
        run: helm package "$CHART_DIR" --destination dist

      - name: Upload package as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: helm-chart
          path: dist/*.tgz

      - name: Login to GitHub Container Registry
        if: github.event_name == 'release' || inputs.publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Check whether the chart version is already published
        id: gate
        if: github.event_name == 'release' || inputs.publish
        env:
          CHART_REF: ${{ env.CHART_REPO }}/${{ steps.meta.outputs.name }}
          CHART_VERSION: ${{ steps.meta.outputs.version }}
        # Only an explicit "not found" allows a push. Any other error (auth,
        # rate limit, network) must fail the job, because helm push silently
        # replaces an existing tag.
        run: |
          if output=$(helm show chart "$CHART_REF" --version "$CHART_VERSION" 2>&1); then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Chart $CHART_VERSION is already published to $CHART_REF - push skipped. Bump version in Chart.yaml to publish a new package."
          elif grep -qF "${CHART_REF#oci://}:${CHART_VERSION}: not found" <<< "$output"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "$output"
            echo "::error::Could not determine whether chart $CHART_VERSION is already published to $CHART_REF."
            exit 1
          fi

      - name: Push chart to ghcr.io
        if: steps.gate.outputs.publish == 'true'
        run: helm push dist/*.tgz "$CHART_REPO"

      - name: Attach package to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.tgz --clobber
