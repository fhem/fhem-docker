apiVersion: v1
kind: Service
metadata:
  name: {{ include "fhem.fullname" . }}
  labels:
    {{- include "fhem.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (or (eq .Values.service.type "NodePort") (eq .Values.service.type "LoadBalancer")) .Values.service.nodePorts.http }}
      nodePort: {{ .Values.service.nodePorts.http }}
      {{- end }}
    {{- if or .Values.service.telnetEnabled (and .Values.httpRoute.enabled .Values.tcpRoute.enabled) }}
    - port: {{ .Values.service.telnetPort }}
      targetPort: telnet
      protocol: TCP
      name: telnet
      {{- if and (or (eq .Values.service.type "NodePort") (eq .Values.service.type "LoadBalancer")) .Values.service.nodePorts.telnet }}
      nodePort: {{ .Values.service.nodePorts.telnet }}
      {{- end }}
    {{- end }}
    {{- range .Values.service.extraPorts }}
    - port: {{ .port }}
      targetPort: {{ .targetPort | default .containerPort | default .port }}
      protocol: {{ .protocol | default "TCP" }}
      {{- if .name }}
      name: {{ .name }}
      {{- end }}
      {{- if and (or (eq $.Values.service.type "NodePort") (eq $.Values.service.type "LoadBalancer")) .nodePort }}
      nodePort: {{ .nodePort }}
      {{- end }}
    {{- end }}
  selector:
    {{- include "fhem.selectorLabels" . | nindent 4 }}
