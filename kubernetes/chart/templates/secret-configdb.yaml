{{- if and (include "fhem.configDBEnabled" .) (not (and .Values.configDB .Values.configDB.existingSecret)) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fhem.configDBSecretName" . }}
  labels:
    {{- include "fhem.labels" . | nindent 4 }}
  {{- with .Values.configDB.secretAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  configDB.conf: {{ printf "%%dbconfig= (\n  connection => '%s',\n  user => '%s',\n  password => '%s'\n);" .Values.configDB.connection .Values.configDB.user .Values.configDB.password | b64enc }}
{{- end }}
